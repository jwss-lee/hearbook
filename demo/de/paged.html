<!doctype html><html lang="de"><meta charset="utf-8"><title>Weltraumkatzen-Patrouille (Demo)</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>body{margin:0;background:#1c1c1e;color:#eee;font-family:-apple-system,system-ui,sans-serif}
a{color:#8ab4ff}.wrap{max-width:720px;margin:0 auto}img{display:block;width:100%;height:auto}
.top{padding:14px 16px;font-size:14px;line-height:1.5}.top b{font-size:16px}</style>
<style>html,body{height:100%;overflow:hidden}#v{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}#v img{max-width:100%;max-height:100%;width:auto}
.langs{position:fixed;top:0;left:0;right:0;z-index:2;text-align:center;padding:8px;font-size:14px;background:rgba(28,28,30,.85)}#v{top:36px!important}#n{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:13px;opacity:.7}</style>
<body><nav class="langs"><a href="../ja/paged.html">日本語</a> · <a href="../en/paged.html">English</a> · <b>Deutsch</b> · <a href="../ko/paged.html">한국어</a></nav><div id="v"><img id="p" src="g1.png" alt="Weltraumkatzen-Patrouille (Demo)"></div><div id="n"></div>
<script>
var P=['g1','g2','g3','1','2','3','4'],i=1,N=P.length,rtl=false;
function show(){document.getElementById('p').src=P[i-1]+'.png';document.getElementById('n').textContent=i+' / '+N;}
function go(d){var j=i+d; if(j<1||j>N) return; i=j; show();}
document.getElementById('v').addEventListener('click',function(e){var left=e.clientX<innerWidth/2; go(left===rtl?1:-1);});
document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(rtl?1:-1); if(e.key==='ArrowRight')go(rtl?-1:1);});
var sx=null;document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX});
document.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go((dx>0)===rtl?1:-1);sx=null});
show();
</script></body></html>
